<article class="card project-card mb-3">
  <div class="card-body">
    <h2 class="card-title h4">
      {{ project.name|default:"Без названия" }}
    </h2>

    <p class="card-text">
      {{ project.description|truncatewords:12 }}
    </p>

    <p class="card-text">
      Руководитель: {{ project.manager }}<br>
      Задач в проекте: {{ project.tasks|length }}
    </p>

    <p class="card-text">
      {% include "project_pages/includes/project_status.html" %}
    </p>

    <a
      href="{% url 'projects:detail' project.id %}"
      class="btn btn-primary"
    >
      Подробнее
    </a>
  </div>
</article>
